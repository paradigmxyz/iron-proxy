dns:
  proxy_ip: "127.0.0.1"
  listen: "127.0.0.1:0"

proxy:
  http_listen: "127.0.0.1:0"
  https_listen: "127.0.0.1:0"
  upstream_deny_cidrs: [] # The credential-checking test server uses loopback.

tls:
  ca_cert: tmp/ca.crt
  ca_key: tmp/ca.key

transforms:
  - name: allowlist
    config:
      domains: ["127.0.0.1"]
  - name: secrets
    config:
      secrets:
        - source:
            type: turnkey
            organization_id: "{{.OrganizationID}}"
            secret_id: "{{.SecretID}}"
            json_key: api_key
            ttl: 1m
            failure_ttl: 1s
          proxy_value: proxy-turnkey-secret
          match_headers: ["Authorization"]
          require: true
          rules:
            - host: "127.0.0.1"

metrics:
  listen: "127.0.0.1:0"

log:
  level: info
